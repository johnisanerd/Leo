<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1520" role="img" aria-label="Flow diagram: a website URL, social handles, or a manual edit feed an ingestion pipeline that scrapes each source with Firecrawl, Apify, and optionally Exa; the combined text is sent to Gemini 2.5-flash to extract a structured Brand Core; if Gemini's JSON fails to parse, an empty skeleton is saved instead, but either way the result is written to the same Firestore field and marked complete, becoming the Brand Core every future chat message uses.">
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}.mono{font-family:ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;}</style>
<rect x="0" y="0" width="1440" height="1520" fill="#0a0d13"></rect>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4658"></path>
    </marker>
    <marker id="a1r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f16273"></path>
    </marker>
  </defs>

  <!-- source band -->
  <rect x="40" y="30" width="1360" height="260" rx="18" fill="#0d1219" stroke="#1b2430"></rect>
  <text x="64" y="60" class="mono" font-size="12.5" letter-spacing="1.6" fill="#57626f">WHERE BRAND CORE DATA COMES FROM</text>

  <!-- source nodes -->
  <g class="node">
    <rect x="80" y="90" width="380" height="130" rx="12" fill="#10151d" stroke="#262f3d"></rect>
    <text x="270" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#e9edf3">Website URL</text>
    <text x="270" y="166" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">ingestion-overlay.tsx</text>
    <text x="270" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">(frontend intake form)</text>
  </g>
  <g class="node">
    <rect x="530" y="90" width="380" height="130" rx="12" fill="#10151d" stroke="#262f3d"></rect>
    <text x="720" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#e9edf3">Social handles</text>
    <text x="720" y="166" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">Instagram · Facebook · TikTok</text>
    <text x="720" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">LinkedIn · X · YouTube · Threads</text>
  </g>
  <g class="node">
    <rect x="980" y="90" width="380" height="130" rx="12" fill="#10151d" stroke="#262f3d"></rect>
    <text x="1170" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#e9edf3">Manual edit</text>
    <text x="1170" y="166" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">brand-core-panel.tsx</text>
    <text x="1170" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">(typed straight into the panel)</text>
  </g>

  <!-- converge to ingestion start -->
  <polyline points="270,220 270,300 660,300 660,380" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>
  <polyline points="720,220 720,380" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>
  <polyline points="1170,220 1170,300 780,300 780,380" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>

  <g class="node">
    <rect x="480" y="380" width="480" height="100" rx="12" fill="#132235" stroke="#4f8fe0"></rect>
    <text x="720" y="424" text-anchor="middle" font-size="16" font-weight="600" fill="#e9edf3">Credits deducted → ingestion starts</text>
    <text x="720" y="450" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">api/routes/ingestion.py · pipeline.py::run</text>
  </g>

  <!-- fan to scrapers -->
  <polyline points="720,480 720,520 270,520 270,560" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>
  <polyline points="720,480 720,560" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>
  <polyline points="720,480 720,520 1170,520 1170,560" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>

  <g class="node">
    <rect x="80" y="560" width="380" height="110" rx="12" fill="#2b2414" stroke="#e3a83b"></rect>
    <text x="270" y="602" text-anchor="middle" font-size="15.5" font-weight="600" fill="#e9edf3">Firecrawl scrapes the website</text>
    <text x="270" y="628" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">→ clean markdown + brand-attribute guess</text>
    <text x="270" y="646" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">firecrawl_client.py::scrape_url</text>
  </g>
  <g class="node">
    <rect x="530" y="560" width="380" height="110" rx="12" fill="#2b2414" stroke="#e3a83b"></rect>
    <text x="720" y="602" text-anchor="middle" font-size="15.5" font-weight="600" fill="#e9edf3">Apify scrapes each platform</text>
    <text x="720" y="628" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">1 actor per platform · IG/FB/TikTok/</text>
    <text x="720" y="646" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">LinkedIn/X/YouTube/Threads</text>
  </g>
  <g class="node">
    <rect x="980" y="560" width="380" height="110" rx="12" fill="#2b2414" stroke="#e3a83b" stroke-dasharray="7 5"></rect>
    <text x="1170" y="602" text-anchor="middle" font-size="15.5" font-weight="600" fill="#e9edf3">Exa finds similar brands</text>
    <text x="1170" y="628" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">optional enrichment step</text>
    <text x="1170" y="646" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">only if a website URL + Exa key exist</text>
  </g>

  <!-- converge to gemini -->
  <polyline points="270,670 270,720 720,720 720,760" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>
  <polyline points="720,670 720,760" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>
  <polyline points="1170,670 1170,720 720,720 720,760" fill="none" stroke="#3a4658" stroke-width="1.75"></polyline>
  <rect x="580" y="700" width="280" height="26" rx="13" fill="#141b25" stroke="#2b3547"></rect>
  <text x="720" y="717" text-anchor="middle" class="mono" font-size="10.8" fill="#aeb8c6">combined text, capped at 12,000 chars</text>

  <g class="node">
    <rect x="460" y="760" width="520" height="110" rx="12" fill="#1f1a35" stroke="#a78bfa"></rect>
    <text x="720" y="802" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e9edf3">Gemini 2.5-flash extracts Brand Core</text>
    <text x="720" y="828" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">brand_extractor.py::extract_brand_core</text>
    <text x="720" y="846" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">fixed JSON schema in the prompt</text>
  </g>

  <!-- branch valid / invalid -->
  <polyline points="720,870 720,940" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>
  <rect x="600" y="893" width="150" height="24" rx="12" fill="#141b25" stroke="#2b3547"></rect>
  <text x="675" y="909" text-anchor="middle" class="mono" font-size="10.6" fill="#aeb8c6">valid JSON</text>

  <polyline points="720,870 720,905 1080,905 1080,940" fill="none" stroke="#f16273" stroke-width="1.75" marker-end="url(#a1r)"></polyline>
  <rect x="850" y="886" width="150" height="24" rx="12" fill="#2c151a" stroke="#f16273"></rect>
  <text x="925" y="902" text-anchor="middle" class="mono" font-size="10.6" fill="#f16273">parse fails</text>

  <g class="node">
    <rect x="890" y="940" width="380" height="110" rx="12" fill="#2c151a" stroke="#f16273"></rect>
    <text x="1080" y="978" text-anchor="middle" font-size="15" font-weight="600" fill="#e9edf3">Empty skeleton saved anyway</text>
    <text x="1080" y="1002" text-anchor="middle" class="mono" font-size="11" fill="#8b96a6">brand_extractor.py::_parse_json</text>
    <text x="1080" y="1020" text-anchor="middle" class="mono" font-size="11" fill="#8b96a6">error only logged — status still "complete"</text>
  </g>

  <!-- both into cylinder -->
  <polyline points="720,940 720,1080" fill="none" stroke="#3a4658" stroke-width="1.75" marker-end="url(#a1)"></polyline>
  <polyline points="1080,1050 1080,1080 720,1080" fill="none" stroke="#f16273" stroke-width="1.75" marker-end="url(#a1r)"></polyline>
  <rect x="815" y="1058" width="88" height="24" rx="12" fill="#2c151a" stroke="#f16273"></rect>
  <text x="859" y="1074" text-anchor="middle" class="mono" font-size="10.6" fill="#f16273">either way</text>

  <!-- cylinder -->
  <rect x="490" y="1080" width="460" height="150" fill="#0e2a27"></rect>
  <line x1="490" y1="1100" x2="490" y2="1230" stroke="#35d0c0" stroke-width="1.75"></line>
  <line x1="950" y1="1100" x2="950" y2="1230" stroke="#35d0c0" stroke-width="1.75"></line>
  <ellipse cx="720" cy="1230" rx="230" ry="20" fill="#0e2a27" stroke="#35d0c0" stroke-width="1.75"></ellipse>
  <ellipse cx="720" cy="1100" rx="230" ry="20" fill="#0e2a27" stroke="#35d0c0" stroke-width="1.75"></ellipse>
  <text x="720" y="1160" text-anchor="middle" font-size="15" font-weight="600" fill="#e9edf3">Firestore</text>
  <text x="720" y="1182" text-anchor="middle" class="mono" font-size="11.5" fill="#8b96a6">projects/{id}.brandCore</text>

  <!-- terminal circle -->
  <polyline points="720,1250 720,1273" fill="none" stroke="#4f8fe0" stroke-width="1.75" marker-end="url(#a1)"></polyline>
  <circle cx="720" cy="1360" r="85" fill="#132235" stroke="#4f8fe0" stroke-width="2"></circle>
  <text x="720" y="1352" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e9edf3">Brand Core</text>
  <text x="720" y="1375" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e9edf3">ready</text>

  <text x="720" y="1478" text-anchor="middle" class="mono" font-size="12.5" fill="#57626f">feeds every future chat message ↓</text>
</svg>
